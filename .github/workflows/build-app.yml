name: App Build

# ─────────────────────────────────────────────────────────────────────
# Runner-side workflow for Crafvy app publications (hub apps + project
# apps).
#
# This workflow lives in the PUBLIC releases repo. Source is checked
# out from the PRIVATE page-builder repo via a fine-grained PAT.
# Public-repo Actions minutes are unlimited on GitHub-hosted runners
# → no per-customer macOS billing.
#
# See public-releases-repo/README.md in page-builder for setup.
#
# Fired via `repository_dispatch: app-build` from the platform (see
# src/lib/apps/build-worker.ts → githubActionsRunner). The platform's
# GITHUB_APP_BUILDER_REPO env var must point at Crafvy/crafvy-builder-releases
# so events land on this repo instead of page-builder.
#
# Required configuration on THIS repo:
#   Secret    PAGE_BUILDER_READ_TOKEN Fine-grained PAT with Contents:Read
#                                     on Crafvy/page-builder
#   Variable  CRAFVY_URL              https://app.crafvy.com
#   Secret    CRAFVY_BUILD_SECRET     Same value as BUILD_CALLBACK_SECRET
#                                     on the platform (HMACs both callbacks
#                                     and the signing-material fetch)
# Optional (defaults sane):
#   Variable  RUNNER_NAME             Displayed in the admin build list;
#                                     defaults to "github-actions".
#
# The workflow NEVER stores customer signing material in this repo's
# secrets. Material is fetched fresh per build from the platform via
# /api/apps/builds/{id}/signing-material and lives only in the runner's
# scratch keychain / keystore file, which is scrubbed on both success
# and failure paths.
# ─────────────────────────────────────────────────────────────────────

on:
  repository_dispatch:
    types: [app-build]
  workflow_dispatch:
    inputs:
      buildId:
        description: 'Build ID (for manual re-run of a failed build)'
        required: true
      platform:
        description: 'macos | windows | linux | ios | android'
        required: true
      sourceRef:
        description: 'page-builder ref to build from (default: main)'
        required: false
        default: 'main'

permissions:
  contents: read

concurrency:
  group: app-build-${{ github.event.client_payload.buildId || inputs.buildId }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ github.event.client_payload.buildId || inputs.buildId }}
    # Runner selection.
    #
    # Default: GitHub-hosted VM per target platform.
    #   iOS / macOS      → macos-latest   (Xcode + notarization tools)
    #   Windows          → windows-latest (MSBuild + signtool)
    #   Android / Linux  → ubuntu-22.04   (Android SDK / Tauri deps)
    #
    # To route builds to your OWN hardware (unlimited minutes, customer
    # P12 never leaves your building), register a self-hosted runner in
    # this repo with a label per platform and set repo variables:
    #   RUNS_ON_MACOS   → e.g. '["self-hosted","macOS","apple-silicon"]'
    #   RUNS_ON_WINDOWS → e.g. '["self-hosted","Windows"]'
    #   RUNS_ON_LINUX   → e.g. '["self-hosted","Linux","x64"]'
    runs-on: >-
      ${{
        fromJSON(
          (github.event.client_payload.platform || inputs.platform) == 'macos'   && (vars.RUNS_ON_MACOS   || '"macos-latest"')   ||
          (github.event.client_payload.platform || inputs.platform) == 'ios'     && (vars.RUNS_ON_MACOS   || '"macos-latest"')   ||
          (github.event.client_payload.platform || inputs.platform) == 'windows' && (vars.RUNS_ON_WINDOWS || '"windows-latest"') ||
          (github.event.client_payload.platform || inputs.platform) == 'android' && (vars.RUNS_ON_LINUX   || '"ubuntu-22.04"')   ||
                                                                                     (vars.RUNS_ON_LINUX   || '"ubuntu-22.04"')
        )
      }}

    env:
      BUILD_ID:      ${{ github.event.client_payload.buildId       || inputs.buildId }}
      PLATFORM:      ${{ github.event.client_payload.platform      || inputs.platform }}
      ARCH:          ${{ github.event.client_payload.arch          || '' }}
      SIGNED:        ${{ github.event.client_payload.signed        || 'false' }}
      RUNNER_NAME:   ${{ vars.RUNNER_NAME || 'github-actions' }}
      # Callback base URL comes from the dispatch payload first so
      # each platform instance (dev/staging/prod) points the runner
      # at itself — one workflow, N environments, no repo-variable
      # flipping. Falls back to CRAFVY_URL for manual workflow_dispatch
      # runs which have no payload.
      CRAFVY_URL:    ${{ github.event.client_payload.callbackUrl || vars.CRAFVY_URL }}
      CRAFVY_SECRET: ${{ secrets.CRAFVY_BUILD_SECRET }}
      # sourceRef: use `sourceRef` from the dispatch client_payload if
      # the platform started including it (future-proofing — the
      # current runner doesn't pass one), else workflow_dispatch input,
      # else `main`. NEVER falls back to github.ref_name — the
      # workflow itself lives in the public repo, so its own ref
      # would be `main` there, not a page-builder ref.
      SOURCE_REF: ${{ github.event.client_payload.sourceRef || inputs.sourceRef || 'main' }}
      # Descriptor is a JSON object; stringify + escape via toJSON so
      # embedded quotes don't wreck the shell. Consumed as JSON inside
      # steps that need it.
      DESCRIPTOR_JSON: ${{ toJSON(github.event.client_payload.scopeDescriptor) }}

    steps:
      # ─── 0. Guard rails ────────────────────────────────────────────
      - name: Sanity-check config
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$CRAFVY_URL" ] || [ -z "$CRAFVY_SECRET" ]; then
            echo "::error::CRAFVY_URL / CRAFVY_BUILD_SECRET not configured on this repo"
            exit 1
          fi
          if [ -z "${{ secrets.PAGE_BUILDER_READ_TOKEN }}" ]; then
            echo "::error::PAGE_BUILDER_READ_TOKEN not set — cannot checkout private source. See public-releases-repo/README.md."
            exit 1
          fi
          if [ -z "$BUILD_ID" ]; then
            echo "::error::No buildId in event payload"
            exit 1
          fi
          echo "Build $BUILD_ID for platform $PLATFORM (signed=$SIGNED) @ page-builder ref $SOURCE_REF"

      # ─── 1. Announce start ────────────────────────────────────────
      - name: Report running
        shell: bash
        run: |
          set -euo pipefail
          BODY="$(jq -n --arg r "$RUNNER_NAME" '{status:"running", runner:$r}')"
          SIG="$(printf '%s.%s' "$BUILD_ID" "$BODY" | openssl dgst -sha256 -hmac "$CRAFVY_SECRET" -r | cut -d' ' -f1)"
          curl -fSs -X POST "$CRAFVY_URL/api/apps/builds/$BUILD_ID/callback" \
            -H "Content-Type: application/json" \
            -H "X-Build-Signature: $SIG" \
            -d "$BODY"

      # ─── 2. Checkout the private page-builder source tree ─────────
      # `desktop/src-tauri` lives there. Token is a fine-grained PAT
      # with Contents:Read on Crafvy/page-builder only.
      - name: Checkout page-builder @ ${{ env.SOURCE_REF }}
        uses: actions/checkout@v4
        with:
          repository: Crafvy/page-builder
          token: ${{ secrets.PAGE_BUILDER_READ_TOKEN }}
          ref: ${{ env.SOURCE_REF }}
          # Shallow clone — Tauri build doesn't need history.
          fetch-depth: 1

      # ─── 3. Materialize the per-build Tauri source tree ────────────
      # Crafvy apps are Tauri SHELLS — a native window that loads a
      # remote URL. Tauri still needs `build.frontendDist` to point at
      # a real folder on disk (it packages whatever's there into the
      # bundle even though runtime just navigates to windows[0].url).
      # We write a minimal stub HTML there — invisible to end users
      # (window.url takes over immediately) but keeps `cargo tauri
      # build` happy.
      - name: Materialize Tauri source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work
          if [ ! -d desktop/src-tauri ]; then
            echo "::error::desktop/src-tauri missing — is the page-builder checkout on the right ref?"
            exit 1
          fi
          cp -R desktop/src-tauri work/src-tauri

          # Write the stub frontendDist ("../dist-<identifier>" resolves
          # to work/dist-<identifier>/ from work/src-tauri/'s POV).
          IDENT="$(echo "$DESCRIPTOR_JSON" | jq -r '.identifier')"
          STUB_DIR="work/dist-$IDENT"
          mkdir -p "$STUB_DIR"
          cat > "$STUB_DIR/index.html" <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <title>Loading…</title>
          <style>html,body{margin:0;padding:0;background:#0f0a1a;color:#7c3aed;font:14px system-ui,sans-serif}main{display:grid;place-items:center;height:100vh}</style>
          <main>Loading…</main>
          HTML

          node -e '
            const fs = require("fs");
            const d = JSON.parse(process.env.DESCRIPTOR_JSON);
            const conf = {
              productName: d.productName,
              version: d.version,
              identifier: d.identifier,
              build: { frontendDist: `../dist-${d.identifier}` },
              app: {
                windows: [{
                  title: d.window.title,
                  width: d.window.width,
                  height: d.window.height,
                  minWidth: d.window.minWidth,
                  minHeight: d.window.minHeight,
                  url: d.startUrl + (d.startUrl.includes("?") ? "&" : "?") +
                       "app=" + encodeURIComponent(d.identifier),
                }],
                security: {
                  csp: [
                    "default-src ${d.startUrl}",
                    ...(d.cspAllowedOrigins || []),
                  ].join(" ")
                },
              },
              bundle: {
                active: true,
                targets: "all",
                icon: d.iconPaths || ["icons/icon.png"],
              },
              plugins: {
                "deep-link": {
                  desktop: { schemes: [d.deepLinkScheme] },
                  mobile: [{ scheme: [d.deepLinkScheme] }],
                },
              },
            };
            fs.writeFileSync("work/src-tauri/tauri.conf.json", JSON.stringify(conf, null, 2));
            console.log("Wrote work/src-tauri/tauri.conf.json for " + d.identifier);
          '

      # ─── 4. Fetch signing material (only if this is a signed build) ─
      # Field names below MUST match what the editor puts into the
      # credential blob — see src/components/apps/app-publication-editor.tsx
      # createCred() blob shape.
      - name: Fetch signing material
        if: env.SIGNED == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/signing
          SIG="$(printf 'sigmat.%s' "$BUILD_ID" | openssl dgst -sha256 -hmac "$CRAFVY_SECRET" -r | cut -d' ' -f1)"
          RESP="$(curl -fSs "$CRAFVY_URL/api/apps/builds/$BUILD_ID/signing-material" \
            -H "X-Build-Signature: $SIG" \
            -H "X-Build-Runner: $RUNNER_NAME")"
          echo "$RESP" | jq -e '.data.material' > work/signing/blob.json
          echo "$RESP" | jq -r '.data.platform' > work/signing/platform.txt
          echo "Signing material fetched for $(cat work/signing/platform.txt)"
          case "$(cat work/signing/platform.txt)" in
            apple)
              jq -r '.apiKeyP8'                  work/signing/blob.json > work/signing/api.p8
              jq -r '.distributionCertP12'       work/signing/blob.json | base64 -d > work/signing/cert.p12
              jq -r '.distributionCertPassword'  work/signing/blob.json > work/signing/cert.pw
              jq -r '.teamId'                    work/signing/blob.json > work/signing/team.id
              jq -r '.appStoreConnectKeyId'      work/signing/blob.json > work/signing/key.id
              # provisioning profile only needed for iOS; harmless on macOS
              jq -r '.provisioningProfile // empty' work/signing/blob.json | base64 -d > work/signing/profile.mobileprovision || true
              ;;
            google)
              jq -r '.serviceAccountJson' work/signing/blob.json > work/signing/play.json
              jq -r '.keystoreJks'        work/signing/blob.json | base64 -d > work/signing/upload.jks
              jq -r '.keystorePassword'   work/signing/blob.json > work/signing/upload.pw
              jq -r '.keyAlias'           work/signing/blob.json > work/signing/upload.alias
              jq -r '.keyPassword'        work/signing/blob.json > work/signing/upload.keypw
              ;;
            macos-developer-id|windows-authenticode)
              # Reserved for future signing platforms — desktop code-sign
              # variants that don't go through App Store. Cred structure
              # will be defined when we add UI for them.
              echo "::error::Signing platform '$(cat work/signing/platform.txt)' has no runner support yet"
              exit 1
              ;;
            *)
              echo "::error::Unknown signing platform: $(cat work/signing/platform.txt)"
              exit 1
              ;;
          esac
          chmod -R go-rwx work/signing || true

      # ─── 5. Toolchains ─────────────────────────────────────────────
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Rust (Tauri)
        uses: dtolnay/rust-toolchain@stable
        with:
          # iOS: Rust needs to cross-compile to the Apple mobile targets.
          # Android: cargo-ndk drives cross-compilation to the four
          # Android ABIs Tauri ships for.
          targets: >-
            ${{
              env.PLATFORM == 'ios'     && 'aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios'                     ||
              env.PLATFORM == 'android' && 'aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android' ||
                                           ''
            }}
      - name: Install Tauri deps (Linux only)
        if: env.PLATFORM == 'linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev \
            libappindicator3-dev librsvg2-dev libssl-dev
      - name: Setup Java 17 (Android)
        if: env.PLATFORM == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK + NDK
        if: env.PLATFORM == 'android'
        uses: android-actions/setup-android@v3
        with:
          # Match Tauri 2's default NDK target. Pin exact version so a
          # newer Google-released NDK can't shift ABI behavior mid-week.
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0 ndk;27.0.12077973'

      # ─── 6. Build the platform artifact ────────────────────────────
      - name: Build (desktop)
        if: env.PLATFORM == 'macos' || env.PLATFORM == 'windows' || env.PLATFORM == 'linux'
        shell: bash
        working-directory: work/src-tauri
        run: |
          set -euo pipefail
          cargo install tauri-cli --version '^2' --locked
          cargo tauri build

      # iOS build — signed + ready for App Store upload.
      #
      # macos-latest runners ship with recent Xcode. We:
      #   1. Build an EPHEMERAL keychain (destroyed with the runner VM),
      #      import the customer's .p12, tell the keychain to allow
      #      codesign to use the key without an interactive prompt.
      #   2. Install the .mobileprovision under its UUID so Xcode picks
      #      it up automatically during the build.
      #   3. Point Tauri at the team ID via env var so its generated
      #      xcconfig signs against the right identity.
      #   4. cargo tauri ios build --export-method app-store — Tauri
      #      wraps xcodebuild archive + exportArchive.
      #   5. Locate the resulting .ipa and stage it at work/artifact.ipa
      #      for the shared upload step.
      #
      # Per-tenant knobs that MAY need adjustment on first customer:
      #   - export-method: currently "app-store". Use "ad-hoc" for
      #     TestFlight-only distribution or "development" for sideload.
      #   - Bundle ID mismatch between .mobileprovision and
      #     tauri.conf.json will fail signing — the descriptor's
      #     `identifier` is written into tauri.conf.json in step 3
      #     above, so keep the customer's App ID Prefix matching.
      - name: Build (iOS)
        if: env.PLATFORM == 'ios'
        shell: bash
        working-directory: work/src-tauri
        run: |
          set -euo pipefail
          SIGNING="$GITHUB_WORKSPACE/work/signing"

          # 1. Ephemeral keychain
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PW="$(openssl rand -hex 16)"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN_PATH"
          # Prepend our keychain so codesign finds it first.
          EXISTING="$(security list-keychains -d user | sed -E 's/\s+"?([^"]+)"?/\1/g' | tr '\n' ' ')"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $EXISTING

          # 2. Import cert + allow codesign to use it non-interactively
          security import "$SIGNING/cert.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$(cat "$SIGNING/cert.pw")" \
            -A -t cert -f pkcs12 \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PW" "$KEYCHAIN_PATH"

          # 3. Install provisioning profile under its UUID
          PROFILES_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES_DIR"
          if [ ! -s "$SIGNING/profile.mobileprovision" ]; then
            echo "::error::No provisioning profile in signing material — customer must upload a .mobileprovision in the Submit tab."
            exit 1
          fi
          PROFILE_UUID="$(security cms -D -i "$SIGNING/profile.mobileprovision" \
            | plutil -extract UUID xml1 -o - - \
            | sed -n 's/.*<string>\(.*\)<\/string>.*/\1/p' | head -1)"
          cp "$SIGNING/profile.mobileprovision" "$PROFILES_DIR/$PROFILE_UUID.mobileprovision"
          echo "Installed provisioning profile $PROFILE_UUID"

          # 4. Build
          cargo install tauri-cli --version '^2' --locked
          export APPLE_DEVELOPMENT_TEAM="$(cat "$SIGNING/team.id")"
          cargo tauri ios init
          cargo tauri ios build --export-method app-store

          # 5. Stage .ipa for the upload step
          IPA="$(find gen/apple -type f -name '*.ipa' | head -1)"
          if [ -z "$IPA" ]; then
            echo "::error::iOS build produced no .ipa. Search paths:"
            find gen/apple -type f -maxdepth 4 | head -50 || true
            exit 1
          fi
          mkdir -p "$GITHUB_WORKSPACE/work"
          cp "$IPA" "$GITHUB_WORKSPACE/work/artifact.ipa"

      # Android build — signed .aab ready for Play Console.
      #
      # ubuntu runner with Android SDK/NDK installed above. Signing is
      # pure gradle — pass the JKS + credentials via -Pandroid.injected
      # properties which the Android Gradle Plugin picks up.
      #
      # Per-tenant knobs:
      #   - Play upload track ("internal" / "alpha" / "beta" /
      #     "production") not automated here; customer uploads the .aab
      #     via Play Console UI or a follow-up step using play.json.
      - name: Build (Android)
        if: env.PLATFORM == 'android'
        shell: bash
        working-directory: work/src-tauri
        run: |
          set -euo pipefail
          SIGNING="$GITHUB_WORKSPACE/work/signing"

          # Tauri regenerates gen/android/ on init; safe to run each
          # build. --ci makes tauri skip interactive prompts.
          cargo install tauri-cli --version '^2' --locked
          cargo tauri android init --ci

          # Build the release bundle (.aab) with signing injected.
          # Gradle properties are read by AGP's release variant.
          cd gen/android
          ./gradlew bundleRelease \
            "-Pandroid.injected.signing.store.file=$SIGNING/upload.jks" \
            "-Pandroid.injected.signing.store.password=$(cat "$SIGNING/upload.pw")" \
            "-Pandroid.injected.signing.key.alias=$(cat "$SIGNING/upload.alias")" \
            "-Pandroid.injected.signing.key.password=$(cat "$SIGNING/upload.keypw")"

          AAB="$(find app/build/outputs/bundle -type f -name '*.aab' | head -1)"
          if [ -z "$AAB" ]; then
            echo "::error::Android build produced no .aab. Search paths:"
            find app/build/outputs -type f -maxdepth 5 | head -50 || true
            exit 1
          fi
          mkdir -p "$GITHUB_WORKSPACE/work"
          cp "$AAB" "$GITHUB_WORKSPACE/work/artifact.aab"

      # ─── 7. Locate + upload artifact ───────────────────────────────
      - name: Locate artifact
        id: locate
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          case "$PLATFORM" in
            macos)   FILE=$(find work/src-tauri/target/release/bundle/dmg -name '*.dmg' | head -1) ;;
            windows) FILE=$(find work/src-tauri/target/release/bundle -type f \( -name '*.msi' -o -name '*-setup.exe' \) | head -1) ;;
            linux)   FILE=$(find work/src-tauri/target/release/bundle -type f \( -name '*.AppImage' -o -name '*.deb' \) | head -1) ;;
            ios)     FILE=$(find work -type f -name 'artifact.ipa' | head -1) ;;
            android) FILE=$(find work -type f -name 'artifact.aab' | head -1) ;;
          esac
          if [ -z "$FILE" ] || [ ! -f "$FILE" ]; then
            echo "::error::No artifact found for platform $PLATFORM"
            exit 1
          fi
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$FILE")" >> "$GITHUB_OUTPUT"
          echo "sha=$(shasum -a 256 "$FILE" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "size=$(stat -c %s "$FILE" 2>/dev/null || stat -f %z "$FILE")" >> "$GITHUB_OUTPUT"

      # Belt-and-suspenders debugging aid — keep the artifact accessible
      # in the Actions UI for 14 days regardless of whether the
      # platform-side upload below succeeds. If the platform upload
      # ever breaks, the operator can still hand-download from here.
      - name: Attach artifact to run (debug retention)
        if: success() && steps.locate.outputs.file
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ env.BUILD_ID }}
          path: ${{ steps.locate.outputs.file }}
          retention-days: 14

      # ─── 8. Upload artifact to platform storage ────────────────────
      # Streams the built binary into the customer's asset storage so
      # it appears in their Apps folder + counts against their quota +
      # inherits sharing/version-history/retention. Storage key comes
      # back in the response and rides along in the completed callback
      # so registerBuildArtifactAsAsset() can glue the asset row.
      - name: Upload artifact to platform
        id: upload
        if: success() && steps.locate.outputs.file
        shell: bash
        run: |
          set -euo pipefail
          SIG="$(printf 'artifact.%s' "$BUILD_ID" | openssl dgst -sha256 -hmac "$CRAFVY_SECRET" -r | cut -d' ' -f1)"

          # Capture status + body separately so we can log both
          # regardless of outcome. `-o` writes body to a file, `-w`
          # dumps the HTTP status. NO `-f` — we want to see 4xx/5xx
          # bodies, not have curl swallow them.
          BODY_FILE="$(mktemp)"
          STATUS="$(curl -sS -o "$BODY_FILE" -w '%{http_code}' -X POST \
            "$CRAFVY_URL/api/apps/builds/$BUILD_ID/artifact" \
            -H "X-Build-Signature: $SIG" \
            -H "X-Build-Runner: $RUNNER_NAME" \
            -F "file=@${{ steps.locate.outputs.file }}")"
          BODY="$(cat "$BODY_FILE")"
          rm -f "$BODY_FILE"

          # Response type diagnostic — HTML back means Next served a
          # 404/500 error page (route not compiled / thrown error).
          FIRST_CHAR="$(printf '%s' "$BODY" | head -c 1)"
          if [ "$FIRST_CHAR" = "<" ]; then
            echo "::error::Upload endpoint returned HTML (status $STATUS) — likely a Next 404 (route missing / not compiled) or 500 (server error). First 400 chars:"
            echo "$BODY" | head -c 400
            echo
            echo "::error::Check that /api/apps/builds/[id]/artifact/route.ts exists and pnpm dev has picked it up (restart dev if just created)."
            exit 1
          fi

          # 3xx redirect — the platform never got the request. Most
          # common cause: dev URL is behind coder's / a tunnel's auth
          # wall that redirects unauthenticated requests to a login
          # page. Callback JSON POSTs sometimes slip through; multipart
          # uploads trip stricter proxy code paths.
          if [ "$STATUS" -ge 300 ] && [ "$STATUS" -lt 400 ]; then
            echo "::error::Upload got HTTP $STATUS (redirect) — the endpoint is auth-walled or behind a proxy that redirects unauthenticated multipart requests."
            echo "::error::Fix: (a) mark coder port 3000 as 'Public' in workspace port settings, OR (b) use a public tunnel like cloudflared for NEXT_PUBLIC_APP_URL, OR (c) test from prod."
            echo "See docs/CI_BUILDS.md 'Testing signed builds from a dev instance' for details."
            exit 1
          fi

          # Non-2xx JSON — surface the platform's error message.
          if [ "$STATUS" != "200" ]; then
            echo "::error::Upload failed with HTTP $STATUS"
            echo "$BODY" | head -c 2000
            exit 1
          fi

          STORAGE_KEY="$(echo "$BODY" | jq -r '.data.storageKey // empty')"
          if [ -z "$STORAGE_KEY" ]; then
            echo "::error::Upload returned 200 but no storageKey in response body:"
            echo "$BODY" | head -c 2000
            exit 1
          fi
          echo "storageKey=$STORAGE_KEY" >> "$GITHUB_OUTPUT"
          echo "Uploaded to $STORAGE_KEY"

      # ─── 9. Report completed / failed ─────────────────────────────
      - name: Report completed
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          FILENAME='${{ steps.locate.outputs.name }}'
          SHA='${{ steps.locate.outputs.sha }}'
          SIZE='${{ steps.locate.outputs.size }}'
          STORAGE_KEY='${{ steps.upload.outputs.storageKey }}'
          LOGS_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          BODY="$(jq -n \
            --arg fn "$FILENAME" --arg sha "$SHA" --arg url "$LOGS_URL" \
            --arg r "$RUNNER_NAME" --arg sk "$STORAGE_KEY" \
            --argjson sz "${SIZE:-0}" \
            '{status:"completed", artifactFilename:$fn, artifactSha256:$sha, artifactSize:$sz, artifactStorageKey:$sk, logsUrl:$url, runner:$r}')"
          SIG="$(printf '%s.%s' "$BUILD_ID" "$BODY" | openssl dgst -sha256 -hmac "$CRAFVY_SECRET" -r | cut -d' ' -f1)"
          curl -fSs -X POST "$CRAFVY_URL/api/apps/builds/$BUILD_ID/callback" \
            -H "Content-Type: application/json" \
            -H "X-Build-Signature: $SIG" \
            -d "$BODY"

      - name: Report failed
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          LOGS_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          BODY="$(jq -n --arg url "$LOGS_URL" --arg r "$RUNNER_NAME" \
            '{status:"failed", errorMessage:"See runner logs", logsUrl:$url, runner:$r}')"
          SIG="$(printf '%s.%s' "$BUILD_ID" "$BODY" | openssl dgst -sha256 -hmac "$CRAFVY_SECRET" -r | cut -d' ' -f1)"
          curl -fSs -X POST "$CRAFVY_URL/api/apps/builds/$BUILD_ID/callback" \
            -H "Content-Type: application/json" \
            -H "X-Build-Signature: $SIG" \
            -d "$BODY" || true

      # ─── 9. Cleanup ────────────────────────────────────────────────
      # Nuke signing material from the runner disk. `always()` so it
      # runs on both success and failure paths.
      - name: Scrub signing material
        if: always()
        shell: bash
        run: |
          rm -rf work/signing || true
